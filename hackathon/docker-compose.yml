# Scaffold local do TB1 (CapiWatt Lens). `docker compose up` sobe os tres
# modulos (frontend, backend, ai) mais Postgres (catalogo do backend) e
# OpenSearch (indice do ai, provisionado mas ainda sem uso real). Nenhuma
# credencial AWS e exigida: EMBEDDER=fake e MAILER=preview sao os valores
# padrao (decisao i2-model-serving).

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AI_BASE_URL: http://ai:8000
      EMBEDDER: fake
      MAILER: preview
      DATABASE_URL: postgresql+psycopg://capiwatt:capiwatt@postgres:5432/capiwatt
    depends_on:
      - ai
      - postgres
    volumes:
      - documents-data:/data/documents

  ai:
    build: ./ai
    ports:
      - "8001:8000"
    environment:
      EMBEDDER: fake
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      - opensearch
    volumes:
      - documents-data:/data/documents

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capiwatt
      POSTGRES_PASSWORD: capiwatt
      POSTGRES_DB: capiwatt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  # Compartilhado entre backend e ai: originais e texto extraido. Sem uso
  # real neste ticket (nenhum job de ingestao ainda grava nele).
  documents-data:
  postgres-data:
  opensearch-data:
