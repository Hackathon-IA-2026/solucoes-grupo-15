[project]
name = "capiwatt-infra"
version = "0.1.0"
description = "CapiWatt Lens - app CDK (Python) da implantacao AWS do TB1 (ADR-0002)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["capiwatt_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
